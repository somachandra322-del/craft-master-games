<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockWave Pro</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:sans-serif;}
body{ background: linear-gradient(135deg,#0f0c29,#302b63,#24243e); overflow:hidden; color:white; }

/* LOADING SCREEN */
#loading{
  position:fixed; inset:0; background:black; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10;
}
.loading-text{ font-size:24px; letter-spacing:2px; animation: glow 1.5s infinite alternate; }
@keyframes glow{ from{text-shadow:0 0 5px cyan;} to{text-shadow:0 0 20px cyan;} }
.loader-bar{ width:250px; height:10px; border:2px solid cyan; margin-top:20px; }
.loader-fill{ height:100%; width:0%; background:cyan; animation: load 3s forwards; }
@keyframes load{ to{ width:100%; } }

/* HOME SCREEN */
#home{
  display:none; height:100vh; flex-direction:column; justify-content:center; align-items:center;
}
.title{ font-size:36px; margin-bottom:30px; text-shadow:0 0 15px cyan; }
.menu button{
  width:200px; padding:12px; margin:10px; font-size:18px; background:#111; color:white; border:2px solid cyan; cursor:pointer; transition:0.3s;
}
.menu button:hover{ background:cyan; color:black; }

/* GAME CANVAS */
#gameCanvas{ display:none; background:#111; display:block; margin:0 auto; border:3px solid cyan; }

/* CHARACTER SELECTION */
#charSelect{ display:none; flex-direction:column; justify-content:center; align-items:center; height:100vh;}
#charSelect button{ margin:10px; padding:12px 20px; font-size:18px; border:2px solid cyan; background:#111; color:white; cursor:pointer; transition:0.3s;}
#charSelect button:hover{ background:cyan; color:black; }

/* SETTINGS */
#settingsMenu{ display:none; flex-direction:column; justify-content:center; align-items:center; height:100vh;}
#settingsMenu label{ margin:10px; display:flex; justify-content:space-between; width:250px;}
#settingsMenu input[type=range]{ width:100px; }

/* NEON PARTICLES */
.particle{
  position:absolute; width:6px; height:6px; background:cyan; opacity:0.3; border-radius:50%;
  animation: float 10s linear infinite;
}
@keyframes float{ from{transform:translateY(100vh);} to{transform:translateY(-10px);} }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loading-text">CRAFT MASTER ANIMATION STUDIO</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<!-- HOME -->
<div id="home">
  <div class="title">BlockWave Pro</div>
  <div class="menu">
    <button id="playBtn">▶ PLAY</button>
    <button id="settingsBtn">⚙ SETTINGS</button>
    <button id="exitBtn">❌ EXIT</button>
  </div>
</div>

<!-- CHARACTER SELECT -->
<div id="charSelect">
  <div class="title">Select Character</div>
  <button data-type="cube">Cube</button>
  <button data-type="triangle">Triangle</button>
  <button data-type="circle">Circle</button>
</div>

<!-- SETTINGS -->
<div id="settingsMenu">
  <div class="title">Settings</div>
  <label>Music Volume <input type="range" id="musicVol" min="0" max="1" step="0.1" value="0.5"></label>
  <label>Game Speed <input type="range" id="speedAdjust" min="2" max="10" step="0.5" value="4"></label>
  <button id="backBtn"> Back</button>
</div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
// ================= LOADING TO HOME =================
setTimeout(()=>{
  document.getElementById("loading").style.display="none";
  document.getElementById("home").style.display="flex";
},3000);

// ================= VARIABLES =================
const home = document.getElementById("home");
const playBtn = document.getElementById("playBtn");
const settingsBtn = document.getElementById("settingsBtn");
const exitBtn = document.getElementById("exitBtn");
const charSelect = document.getElementById("charSelect");
const settingsMenu = document.getElementById("settingsMenu");
const backBtn = document.getElementById("backBtn");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let selectedChar = 'cube';
let char = {x:50, y:300, w:40, h:40, dy:0, gravity:0.8, jumpPower:-15};
let spikes = [];
let particles = [];
let gameSpeed = 4;
let score = 0;
let keys = {};
let musicVolume = 0.5;

// ================= PARTICLES =================
for(let i=0;i<50;i++){
  let p = document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*window.innerWidth+"px";
  p.style.top=Math.random()*window.innerHeight+"px";
  p.style.animationDuration=(5+Math.random()*10)+"s";
  document.body.appendChild(p);
  particles.push(p);
}

// ================= BUTTONS =================
playBtn.addEventListener("click",()=>{ home.style.display="none"; charSelect.style.display="flex"; });
settingsBtn.addEventListener("click",()=>{ home.style.display="none"; settingsMenu.style.display="flex"; });
exitBtn.addEventListener("click",()=>{ alert("Thanks for playing BlockWave Pro!"); });
backBtn.addEventListener("click",()=>{ settingsMenu.style.display="none"; home.style.display="flex"; });

// ================= CHARACTER SELECT =================
charSelect.querySelectorAll("button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    selectedChar = btn.getAttribute("data-type");
    charSelect.style.display="none";
    canvas.style.display="block";
    startGame();
  });
});

// ================= SETTINGS =================
document.getElementById("speedAdjust").addEventListener("input",(e)=>{ gameSpeed=parseFloat(e.target.value); });

// ================= KEYBOARD =================
document.addEventListener("keydown",(e)=>{ keys[e.code]=true; });
document.addEventListener("keyup",(e)=>{ keys[e.code]=false; });

// ================= CREATE SPIKES =================
function createSpikes(){
  if(spikes.length===0 || spikes[spikes.length-1].x<canvas.width-200){
    let height = 40;
    let spike = {x:canvas.width, y:canvas.height-height, w:40, h:40};
    spikes.push(spike);
  }
}

// ================= DRAW CHARACTER =================
function drawCharacter(){
  ctx.fillStyle="cyan";
  if(selectedChar==='cube'){
    ctx.fillRect(char.x,char.y,char.w,char.h);
  } else if(selectedChar==='triangle'){
    ctx.beginPath();
    ctx.moveTo(char.x+char.w/2,char.y);
    ctx.lineTo(char.x,char.y+char.h);
    ctx.lineTo(char.x+char.w,char.y+char.h);
    ctx.closePath();
    ctx.fill();
  } else if(selectedChar==='circle'){
    ctx.beginPath();
    ctx.arc(char.x+char.w/2,char.y+char.h/2,char.w/2,0,Math.PI*2);
    ctx.fill();
  }
}

// ================= UPDATE GAME =================
function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Character Physics
  char.dy += char.gravity;
  if((keys["Space"] || keys["ArrowUp"]) && char.y>=300){ char.dy = char.jumpPower; }
  char.y += char.dy;
  if(char.y>300){ char.y=300; char.dy=0; }

  drawCharacter();

  // Spikes
  createSpikes();
  ctx.fillStyle="red";
  for(let i=0;i<spikes.length;i++){
    let s = spikes[i];
    s.x -= gameSpeed;
    ctx.beginPath();
    ctx.moveTo(s.x+s.w/2,s.y);
    ctx.lineTo(s.x,s.y+s.h);
    ctx.lineTo(s.x+s.w,s.y+s.h);
    ctx.closePath();
    ctx.fill();

    // Collision
    if(char.x < s.x + s.w && char.x + char.w > s.x && char.y < s.y + s.h && char.y + char.h > s.y){
      alert("Game Over! Score: "+score);
      document.location.reload();
    }
  }

  // Score
  score++;
  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText("Score: "+score,650,30);

  requestAnimationFrame(update);
}

// ================= START GAME =================
function startGame(){
  score=0;
  spikes=[];
  char.y=300;
  update();
}
</script>

</body>
</html>
